<!DOCTYPE html>
<html>
<head>
    <title>Security Alert</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .alert-box {
            text-align: center;
            background-color: white;
            padding: 40px;
            width: 450px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            margin-bottom: 20px;
        }

        hr {
            margin: 25px 0;
            border: none;
            border-top: 1px solid #ddd;
        }

        h3 {
            margin-bottom: 10px;
        }

        .warning {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="alert-box">

        <h2 class="warning">⚠ Security Alert</h2>

        <p>A new login was detected on your account.</p>

        <p>If this was not you, change your password immediately.</p>

        <hr>

        <h3>What happened?</h3>

        <p>Your account information may have been exposed.</p>

    </div>

</body>
</html>
