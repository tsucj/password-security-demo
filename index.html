<!DOCTYPE html>
<html>
<head>
    <title>Account Notification</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            width: 450px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #1877f2;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background-color: #0d65d9;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Account Notification</h2>

        <p>Your account needs to be verified.</p>

        <p>Please verify your account to continue.</p>

        <a href="login.html">Verify Your Account</a>

    </div>

</body>
</html>
