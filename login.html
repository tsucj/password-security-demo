<!DOCTYPE html>
<html>
<head>
    <title>Account Verification</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .login-box {
            text-align: center;
            background: white;
            padding: 40px;
            width: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 96%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background-color: #1877f2;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0d65d9;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Account Verification</h2>

        <p>Please enter your information to continue.</p>

        <form action="alert.html">

            <input type="text" placeholder="Username" required>

            <br>

            <input type="password" placeholder="Password" required>

            <br>

            <button type="submit">Verify Account</button>

        </form>

    </div>

</body>
</html>
